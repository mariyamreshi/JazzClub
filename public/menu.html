<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garnet's House - Menu Page</title>
    <link rel="stylesheet" href="/css/menu.css">
</head>
<body>

<!-- Navigation Bar อยู่ด้านนอก -->
<nav class="navbar">
    <div class="brand-text">
        <span class="brand-sub">Garnet's House</span>
    </div>

    <ul class="nav-links">
        <li><a href="/show.html">Live shows</a></li>
        <li><a href="/index.html">The club</a></li>
        <li><a href="/menu.html">Menu</a></li>
    </ul>

    <div class="nav-right">
        <a href="/reserve.html" class="btn-reserve-nav">Reserve a table</a>
    </div>
</nav>

<!-- ส่วนเนื้อหาเมนู -->
<main class="menu-section">
    <!-- Header Section -->
    <div class="menu-header">
        <div class="header-left">
            <h1 class="main-title">
                Good food,<br>
                <span class="highlight-text">made simple.</span>
            </h1>
        </div>

        <div class="header-right">
            <div class="search-box">
                <input type="search" id="searchInput" aria-label="Search menu" placeholder="Search menu">
                <button id="searchBtn" type="button">SEARCH</button>
            </div>
        </div>
    </div>
    <!-- Filter & Counter -->
    <div class="filter-container">
        <div class="category-buttons">
            <button class="filter-btn active" data-category="recommended">Recommended</button>
            <button class="filter-btn" data-category="seasonal">Seasonal</button>
            <button class="filter-btn" data-category="cocktail">Cocktail</button>
            <button class="filter-btn" data-category="liquor">Liquor</button>
            <button class="filter-btn" data-category="dessert">Dessert</button>
            <button class="filter-btn" data-category="appetizer">Appetizer</button>
        </div>
        <span id="menuCount" class="menu-count">0 items</span>
    </div>

    <p id="menuStatus" class="menu-status" role="status" aria-live="polite">Loading menu...</p>
    <button id="retryMenu" class="retry-menu" type="button" hidden>Try again</button>

    <!-- Dish Cards Grid -->
    <div class="dishes-grid" id="dishesGrid" aria-busy="true">
        <!-- Dish items will be rendered by JavaScript -->
    </div>
</main>

<script src="/js/pages/menu.js" defer></script>
</body>
</html>
