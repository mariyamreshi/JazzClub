<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garnet's House - Menu Page</title>
    <link rel="stylesheet" href="/css/menu.css">
    <link rel="stylesheet" href="/css/nav.css">
</head>
<body>

<!-- Navigation Bar อยู่ด้านนอก -->
<nav class="navbar">
    <div class="brand-text">
        <span class="brand-sub">Garnet's House</span>
    </div>

    <ul class="nav-links">
        <li><a href="/index.html">The club</a></li>
        <li><a href="/show.html">Live shows</a></li>
        <li><a href="/menu.html">Menu</a></li>
        <li><a href="/order.html">Order</a></li>
    </ul>

    <div class="nav-right">
        <a href="/reserve.html" class="btn-reserve-nav">Reserve a table</a>
    </div>
</nav>

<!-- ส่วนเนื้อหาเมนู -->
<main class="menu-section">
    <!-- Header Section -->
    <div class="menu-header">
        <div class="header-left">
            <h1 class="main-title">
                Good food,<br>
                <span class="highlight-text">made simple.</span>
            </h1>
        </div>

        <div class="header-right">
            <div class="search-box">
                <input type="search" id="searchInput" aria-label="Search menu" placeholder="Search menu">
                <button id="searchBtn" type="button">SEARCH</button>
            </div>
        </div>
    </div>
    <!-- Filter & Counter -->
    <div class="filter-container">
        <div class="category-buttons">
            <button class="filter-btn active" data-category="recommended">Recommended</button>
            <button class="filter-btn" data-category="seasonal">Seasonal</button>
            <button class="filter-btn" data-category="cocktail">Cocktail</button>
            <button class="filter-btn" data-category="liquor">Liquor</button>
            <button class="filter-btn" data-category="dessert">Dessert</button>
            <button class="filter-btn" data-category="appetizer">Appetizer</button>
        </div>
        <span id="menuCount" class="menu-count">0 items</span>
    </div>

    <p id="menuStatus" class="menu-status" role="status" aria-live="polite">Loading menu...</p>
    <button id="retryMenu" class="retry-menu" type="button" hidden>Try again</button>

    <!-- Dish Cards Grid -->
    <div class="dishes-grid" id="dishesGrid" aria-busy="true">
        <!-- Dish items will be rendered by JavaScript -->
    </div>
</main>

<dialog id="orderDialog" class="order-dialog" aria-labelledby="orderDialogTitle">
    <div class="order-dialog-header">
        <div>
            <span class="order-eyebrow">RESERVATION ORDER</span>
            <h2 id="orderDialogTitle">Order an item</h2>
        </div>
        <button id="closeOrderDialog" class="order-dialog-close" type="button" aria-label="Close">×</button>
    </div>

    <form id="orderForm">
        <div class="order-item-summary">
            <div>
                <span id="orderItemCategory" class="dish-category"></span>
                <strong id="orderItemName"></strong>
            </div>
            <span id="orderItemPrice" class="order-item-price"></span>
        </div>

        <label class="order-field" for="orderReservationId">
            <span>Reservation ID</span>
            <input id="orderReservationId" type="text" inputmode="numeric" autocomplete="off"
                   pattern="(?:[Rr]-)?[1-9][0-9]*" placeholder="Example: R-45 or 45" required>
            <small>Enter the ID shown on your reservation pass, with or without R-.</small>
        </label>

        <label class="order-field" for="orderQuantity">
            <span>Quantity</span>
            <input id="orderQuantity" type="number" min="1" max="99" step="1" value="1" required>
        </label>

        <div class="order-total-row">
            <span>Order total</span>
            <strong id="orderTotal">$0.00</strong>
        </div>
        <p id="orderError" class="order-error" role="alert" hidden></p>

        <div class="order-dialog-actions">
            <button id="cancelOrder" class="order-secondary" type="button">Cancel</button>
            <button id="submitOrder" class="order-primary" type="submit">Place order</button>
        </div>
    </form>

    <div id="orderSuccess" class="order-success" hidden>
        <span class="order-success-mark">✓</span>
        <h3>Order placed</h3>
        <p id="orderSuccessSummary"></p>
        <button id="finishOrder" class="order-primary" type="button">Back to menu</button>
    </div>
</dialog>

<script src="/js/pages/menu.js" defer></script>
</body>
</html>
