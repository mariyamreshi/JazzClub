<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live on our stage</title>
    <link rel="stylesheet" href="./css/show.css">
    <!-- Google Fonts: Playfair Display (Serif) & Inter (Sans-serif) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<section class="shows-section">
    <div class="shows-container">

        <!-- Section Header -->
        <div class="shows-header">
            <h2 class="shows-title">Live on our stage</h2>

        </div>

        <p id="showsStatus" class="shows-status" role="status" aria-live="polite">Loading shows...</p>
        <button id="retryShows" class="retry-shows" type="button" hidden>Try again</button>
        <div id="showsList" class="shows-list" aria-busy="true"></div>

        <template id="showTemplate">
            <article class="show-item">
                <div class="show-img-wrapper">
                    <img src="https://images.unsplash.com/photo-1511192336575-5a79af67a629?auto=format&fit=crop&w=400&q=80" alt="" loading="lazy">
                    <time class="date-badge"></time>
                </div>
                <div class="show-details">
                    <span class="genre-tag"></span>
                    <h3 class="band-title"></h3>
                    <div class="show-meta">
                        <i class="fa-regular fa-clock" aria-hidden="true"></i>
                        <time class="start-time"></time>
                    </div>
                </div>
                <a href="/reserve.html" class="arrow-btn" aria-label="Reserve a table">
                    <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
                </a>
            </article>
        </template>

    </div>
</section>

<script src="/js/pages/show.js" defer></script>
</body>
</html>
