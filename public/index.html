<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blue Lark - Jazz Club Bangkok</title>
  <link rel="stylesheet" href="/css/home.css">
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Hero Section with Background -->
<header class="hero-section">
  <!-- Overlay for dark atmosphere -->
  <div class="overlay"></div>

  <!-- Navigation Bar -->
  <nav class="navbar">
      <div class="brand-text">
        <span class="brand-sub">Garnet's House</span>
      </div>

    <ul class="nav-links">
      <li><a href="#shows" class="active">Live shows</a></li>
      <li><a href="#menu">Menu</a></li>
    </ul>
    </ul>

    <div class="nav-right">
      <a href="#reserve" class="btn-reserve-nav">Reserve a table</a>
      <a href="#staff" class="nav-staff">Admin</a>
    </div>
  </nav>

  <!-- Hero Content -->
  <div class="hero-container">
    <div class="hero-content">
      <p class="tagline">LIVE FROM CHIANGMAI • SINCE 2026</p>
      <h1 class="main-title">Replace this<br><em>Replace this</em></h1>
      <p class="description">
        Replace this
      </p>

      <div class="cta-buttons">
        <a href="#reserve" class="btn-primary">Reserve your table <i class="fa-solid fa-chevron-right"></i></a>
      </div>
    </div>
  </div>

  <!-- Bottom Widget (On Stage Tonight) -->
  <div class="bottom-widget">
    <div class="widget-col band-info">
      <span class="widget-label">ON STAGE TONIGHT:</span>
      <h3 class="band-name">The Weekend</h3>
    </div>

    <div class="widget-col flex-row">
      <i class="fa-regular fa-clock widget-icon"></i>
      <div>
        <span class="widget-sub">DOORS 6:00 PM</span>
        <p class="widget-val">Show 10:30 PM</p>
      </div>
    </div>

    <div class="widget-col flex-row">
      <i class="fa-solid fa-location-dot widget-icon"></i>
      <div>
        <span class="widget-sub">Garnet's house</span>
        <p class="widget-val">CHIANGMAI</p>
      </div>
    </div>

    <div class="widget-col action">
      <a href="#book" class="book-link">Book tonight <i class="fa-solid fa-chevron-right"></i></a>
    </div>
  </div>
</header>

</body>
</html>
