<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Garnet's House - Orders</title>

    <link rel="stylesheet" href="/css/order.css">
    <link rel="stylesheet" href="/css/nav.css">
    <script src="/js/pages/customer-order.js" defer></script>
</head>
<body>

<!-- Navigation Bar -->
<nav class="navbar">
    <div class="brand-text">
        <span class="brand-sub">Garnet's House</span>
    </div>

    <ul class="nav-links">
        <li><a href="/index.html">The club</a></li>
        <li><a href="/show.html">Live shows</a></li>
        <li><a href="/menu.html">Menu</a></li>
        <li><a href="/order.html" >Order</a></li>
    </ul>
    <div class="nav-right">
        <a href="/reserve.html" class="btn-reserve-nav">Reserve a table</a>
    </div>
</nav>

<!-- Customer Order Page -->
<main class="order-content">

    <!-- Page Header -->
    <section class="order-header">
        <p class="eyebrow">GARNET'S HOUSE / YOUR ORDERS</p>

        <h1>
            Your orders<span class="highlight">.</span>
        </h1>
    </section>


    <!-- Order List -->
    <section id="ordersList" class="orders-list"
             aria-live="polite">
        <!-- Orders will be rendered by JavaScript -->
    </section>

    <!-- Empty State -->
    <section id="emptyOrders" class="empty-orders" hidden>

        <h2>No orders yet</h2>
        <a href="/menu.html" class="menu-button">
            Explore the menu
        </a>
    </section>

</main>
</body>
</html>
